<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KD-TTOOL — live run</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel-2: #1c2230; --line: #272e3b;
    --text: #d7dde6; --dim: #7d8797; --accent: #4c8dff;
    --pass: #3fb950; --fail: #f85149; --skip: #8b949e; --run: #d29922;
    --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .meta { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  header .spacer { flex: 1; }
  .counts { display: flex; gap: 14px; font-family: var(--mono); font-size: 13px; }
  .counts b { font-weight: 600; }
  .c-pass b { color: var(--pass); } .c-fail b { color: var(--fail); } .c-skip b { color: var(--skip); }
  .pill {
    font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim);
  }
  #export-btn {
    font: inherit; font-size: 12px; padding: 4px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--text);
  }
  #export-btn:hover { border-color: var(--dim); } #export-btn:disabled { opacity: .5; cursor: wait; }
  #export-msg a { color: inherit; }
  .pill.live { color: var(--run); border-color: #4a3c14; background: #241d0b; }
  .pill.done { color: var(--pass); border-color: #1c3d23; background: #0f2113; }

  main { flex: 1; display: flex; min-height: 0; }

  /* ---- left: the test list (the main thing) ---- */
  #tests { width: var(--left, 44%); min-width: 320px; flex: none; display: flex; flex-direction: column; background: var(--panel); min-height: 0; }
  #tests-head {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line);
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600;
  }
  #tests-head .spacer { flex: 1; }
  .btn {
    font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
  }
  .btn:hover { border-color: var(--dim); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.good { background: #1f6f3a; border-color: #2a8f4c; color: #fff; font-weight: 600; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  #tests-head .btn { text-transform: none; letter-spacing: 0; font-size: 12.5px; padding: 4px 12px; }
  #rows { flex: 1; overflow-y: auto; padding-bottom: 40px; }
  #divider { width: 6px; flex: none; cursor: col-resize; background: var(--line); opacity: .5; transition: opacity .15s, background .15s; }
  #divider:hover, #divider.drag { opacity: 1; background: var(--accent); }
  #right { flex: 1; min-width: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; }

  .card {
    display: flex; align-items: stretch; border-bottom: 1px solid #1b212c; position: relative;
  }
  .card:hover { background: var(--panel-2); }
  .card[aria-current="true"] { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--accent); }
  .card.editing { box-shadow: inset 3px 0 0 var(--run); background: var(--panel-2); }
  .card-main {
    flex: 1; min-width: 0; display: flex; gap: 12px; align-items: flex-start; text-align: left;
    padding: 14px 8px 14px 16px; background: none; border: 0; color: var(--dim); font: inherit; cursor: pointer;
  }
  .card-main:focus-visible, .ibtn:focus-visible, .gap .add:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .card .mark { width: 18px; text-align: center; font-size: 16px; line-height: 1.4; flex: none; }
  .card.pass .mark { color: var(--pass); } .card.fail .mark { color: var(--fail); }
  .card.running .mark { color: var(--run); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card .body { flex: 1; min-width: 0; display: block; }
  .card .ttl { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 16px; font-weight: 600; color: var(--text); line-height: 1.35; }
  .card.pending .ttl, .card.skipped .ttl, .card.manual .ttl { color: var(--dim); }
  .card .sum {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    margin-top: 3px; font-size: 13.5px; line-height: 1.45; color: var(--dim);
  }
  .card .dur { font-family: var(--mono); font-size: 11.5px; color: var(--dim); padding-top: 3px; flex: none; }
  .badge {
    font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim);
  }
  .badge.draft { color: #9dc1ff; border-color: #294a7d; background: #0f1d33; }
  .badge.stale { color: var(--run); border-color: #4a3c14; background: #241d0b; }
  .badge.manual { color: var(--skip); }
  .acts { display: flex; align-items: flex-start; gap: 4px; padding: 10px 12px 10px 4px; flex: none; }
  .ibtn {
    width: 38px; height: 38px; display: inline-grid; place-items: center; border-radius: 8px; cursor: pointer;
    background: transparent; border: 1px solid transparent; color: var(--dim);
  }
  .ibtn svg { width: 20px; height: 20px; }
  .ibtn:hover { color: var(--text); border-color: var(--line); background: var(--bg); }
  .ibtn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: #0f1d33; }

  /* the thin "+" line between two tests */
  .gap { position: relative; height: 0; z-index: 2; }
  .gap .add {
    position: absolute; left: 50%; top: -11px; transform: translateX(-50%); width: 22px; height: 22px; padding: 0;
    border-radius: 50%; border: 1px solid var(--accent); background: var(--panel); color: var(--accent);
    font-size: 16px; line-height: 1; cursor: pointer; opacity: 0; transition: opacity .12s;
  }
  .gap::before { content: ""; position: absolute; left: 12px; right: 12px; top: 0; border-top: 1px dashed var(--accent); opacity: 0; transition: opacity .12s; }
  .gap .add { pointer-events: none; }
  .card:hover + .gap .add, .gap:hover .add, .gap .add:focus-visible { opacity: 1; pointer-events: auto; }
  .card:hover + .gap::before, .gap:hover::before { opacity: .7; }
  .gap .add:hover { background: var(--accent); color: #fff; }
  @media (hover: none) { .gap .add { opacity: .55; pointer-events: auto; } }

  /* ---- the editor drawer: slides open left to right over the right pane ---- */
  #drawer {
    position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 20;
    transform: translateX(-102%); transition: transform .22s ease; visibility: hidden;
    box-shadow: 8px 0 24px rgba(0,0,0,.35);
  }
  #drawer.open { transform: none; visibility: visible; }
  @media (prefers-reduced-motion: reduce) { #drawer { transition: none; } }
  .dr-head { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .dr-head .who { flex: 1; min-width: 200px; }
  .dr-head h2 { margin: 0; font-size: 16px; }
  .dr-head code { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .tabs { display: flex; gap: 4px; }
  .tabs button {
    font: inherit; font-size: 13px; padding: 6px 14px; cursor: pointer; border-radius: 6px;
    border: 1px solid var(--line); background: transparent; color: var(--dim);
  }
  .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  #dr-close { width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--dim); cursor: pointer; font-size: 16px; }
  #dr-close:hover { color: var(--text); border-color: var(--dim); }
  #dr-msg { padding: 0 18px; }
  #dr-msg .msg { margin: 10px 0 0; padding: 8px 12px; border-radius: 6px; font-size: 13.5px; border: 1px solid var(--line); background: var(--panel); }
  #dr-msg .msg.ok { border-color: #1c3d23; background: #0f2113; color: #7ee787; }
  #dr-msg .msg.err { border-color: #5a2226; background: #1a1013; color: #ff9d96; }
  #dr-body { flex: 1; overflow-y: auto; padding: 16px 18px 40px; }
  .form { max-width: 900px; display: flex; flex-direction: column; gap: 14px; }
  .form label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .form input[type=text], .form textarea, .form select {
    font: inherit; font-size: 14.5px; letter-spacing: 0; text-transform: none; font-weight: 400;
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%;
  }
  .form textarea { line-height: 1.5; resize: vertical; min-height: 90px; }
  .form input:focus, .form textarea:focus, .form select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .form .hint { font-size: 12px; color: var(--dim); text-transform: none; letter-spacing: 0; font-weight: 400; }
  .form details summary { cursor: pointer; color: var(--dim); font-size: 13px; padding: 4px 0; }
  .form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
  .form .checks { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 12px; }
  .form .checks label { flex-direction: row; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 13.5px; color: var(--text); font-weight: 400; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
  .actions .status { color: var(--dim); font-size: 13px; }
  .codebar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .codebar code { font-family: var(--mono); font-size: 12.5px; color: #9dc1ff; }
  .codebar .spacer { flex: 1; }
  .code { font-family: var(--mono); font-size: 12.5px; line-height: 1.55; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: auto; padding: 8px 0; }
  .code .ln { display: flex; }
  .code .n { flex: none; width: 48px; text-align: right; padding-right: 12px; color: #545d6b; user-select: none; }
  .code .t { white-space: pre; padding-right: 16px; }
  .code .add { background: rgba(63,185,80,.14); } .code .del { background: rgba(248,81,73,.14); } .code .hunk { color: #9dc1ff; background: rgba(76,141,255,.08); }
  .working { padding: 24px; border: 1px dashed var(--line); border-radius: 8px; color: var(--dim); }
  .working b { color: var(--text); }
  .placeholder { color: var(--dim); font-style: italic; padding: 24px 18px; }

  /* ---- right pane: log + shots ---- */
  #detail { display: flex; flex-direction: column; min-width: 0; overflow: hidden; flex: 1; }
  #detail-head {
    padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex;
    align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  #detail-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  #detail-head code { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  #detail-head #d-script { flex-basis: 100%; color: #9dc1ff; }
  #detail-head #d-script::before { content: "Script run: "; color: var(--dim); }
  #log { flex: 1; overflow-y: auto; padding: 14px 18px 40px; }
  .empty { color: var(--dim); font-style: italic; padding: 24px 0; }

  .line { display: flex; gap: 12px; padding: 2px 0; font-family: var(--mono); font-size: 12.5px; }
  .line .t { color: #545d6b; flex-shrink: 0; }
  .line .m { white-space: pre-wrap; word-break: break-word; }
  .line.note .m { color: #a8b3c4; font-family: inherit; font-size: 13px; }
  .line.err .m { color: var(--fail); }

  .shots { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 12px 62px; }
  .shot { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #000; cursor: zoom-in; width: 190px; }
  .shot img { display: block; width: 100%; height: 120px; object-fit: cover; object-position: top; }
  .shot span {
    display: block; padding: 5px 8px; font-family: var(--mono); font-size: 11px;
    color: var(--dim); background: var(--panel-2); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }

  pre.trace {
    margin: 10px 0 0 62px; padding: 12px 14px; background: #1a1013; border: 1px solid #3d1d1f;
    border-radius: 6px; color: #ff9d96; font-family: var(--mono); font-size: 12px;
    white-space: pre-wrap; word-break: break-word; overflow-x: auto;
  }
  .tracecmd {
    margin: 10px 0 0 62px; padding: 9px 12px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; font-family: var(--mono); font-size: 12px; color: #9dc1ff;
    overflow-x: auto; white-space: nowrap;
  }


  /* ---- big picture strip ---- */
  #bigpic { padding: 8px 18px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .bp-line { display: flex; align-items: baseline; gap: 8px 22px; flex-wrap: wrap; }
  #bp-now { font-size: 15px; font-weight: 650; }
  #bp-counts { display: flex; gap: 6px 16px; flex-wrap: wrap; color: var(--dim); font-size: 13px; }
  #bp-counts b { font-weight: 650; }
  #bp-counts .c-pass b { color: var(--pass); } #bp-counts .c-fail b { color: var(--fail); }
  #bp-counts .c-run b { color: var(--run); }
  .bp-bar { display: flex; height: 6px; margin-top: 7px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .bp-bar i { display: block; height: 100%; transition: width .3s; }
  .bp-bar .p { background: var(--pass); } .bp-bar .f { background: var(--fail); }
  .bp-bar .s { background: var(--skip); } .bp-bar .r { background: var(--run); }

  /* ---- grouped test list ---- */
  .group { padding: 12px 14px 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .row .title { flex: 1; min-width: 0; }
  .row .title small { display: block; font-size: 11px; color: var(--dim); }
  .row.pending .title, .row.skipped .title { color: var(--dim); }

  .steps-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; margin: 0 0 8px; }

  /* ---- lightbox ---- */
  #lightbox {
    position: fixed; inset: 0; background: rgba(3,5,9,.94); display: none;
    align-items: flex-start; justify-content: center; overflow: auto; z-index: 50; cursor: zoom-out;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: min(1100px, 96vw); margin: 3vh 0; border: 1px solid var(--line); }

  @media (max-width: 820px) {
    main { flex-direction: column; }
    #tests { width: 100% !important; height: 46%; }
    #divider { display: none; }
    .shots, pre.trace, .tracecmd { margin-left: 0; }
    .form .row2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>KD-TTOOL</h1>
  <span class="meta" id="target">connecting…</span>
  <span class="pill" id="mode"></span>
  <span class="spacer"></span>
  <span id="export-msg" class="meta"></span>
  <button id="export-btn" type="button">Export report</button>
  <span class="pill live" id="state">waiting</span>
</header>

<section id="bigpic" aria-live="polite">
  <div class="bp-line"><span id="bp-now">Waiting for the run to start…</span><span id="bp-counts"></span></div>
  <div class="bp-bar" aria-hidden="true"><i class="p"></i><i class="f"></i><i class="s"></i><i class="r"></i></div>
</section>

<main>
  <section id="tests" aria-label="Tests">
    <div id="tests-head"><span id="tests-count">Tests</span><span class="spacer"></span><button class="btn" id="add-end" type="button">+ Add test</button></div>
    <div id="rows"></div>
  </section>
  <div id="divider" role="separator" aria-orientation="vertical" aria-label="Resize the test list" tabindex="0"></div>
  <section id="right">
    <section id="detail">
      <div id="detail-head"><h2 id="d-area">—</h2><code id="d-meta"></code><code id="d-script"></code></div>
      <div id="log"><p class="empty">Waiting for the run to start…</p></div>
    </section>
    <aside id="drawer" aria-hidden="true" aria-label="Test editor">
      <div class="dr-head">
        <div class="who"><h2 id="dr-title"></h2><code id="dr-sub"></code></div>
        <div class="tabs" role="tablist" id="dr-tabs">
          <button type="button" role="tab" data-tab="catalog">Catalog entry</button>
          <button type="button" role="tab" data-tab="script">Script</button>
        </div>
        <button id="dr-close" type="button" aria-label="Close editor" title="Close (Esc)">✕</button>
      </div>
      <div id="dr-msg" role="status" aria-live="polite"></div>
      <div id="dr-body"></div>
    </aside>
  </section>
</main>

<div id="lightbox"><img alt=""></div>

<script>
const rows = new Map();      // order -> {area, script, money, status, duration, error, traceDir, entries[]}
let order = [];              // display order
let selected = null;         // currently shown row
let pinned = false;          // true once the user clicks a row: stop auto-following
let seq = 0;
let finished = false;
let lastShown = null;       // which row the log pane last rendered

const $ = (id) => document.getElementById(id);
const MARK = { pending: "·", running: "◜", pass: "✓", fail: "✕", skipped: "⏭" };

function clock(ts) {
  const d = new Date(ts * 1000);
  return d.toTimeString().slice(0, 8);
}

function ensureRow(o, data) {
  if (!rows.has(o)) {
    rows.set(o, { area: "", script: "", money: false, status: "pending", entries: [] });
    order.push(o);
  }
  Object.assign(rows.get(o), data || {});
  return rows.get(o);
}

const TOKEN = "__KD_TOKEN__";
const cat = new Map();       // order -> catalog row (source of truth for the words)
let catOrder = [];
const ICON_CATALOG = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3.5h9.5A1.5 1.5 0 0 1 15 5v11.5H5.5A1.5 1.5 0 0 1 4 15z"/><path d="M4 15a1.5 1.5 0 0 1 1.5-1.5H15"/><path d="M7.5 6.5h4.5M7.5 9h4.5"/></svg>';
const ICON_SCRIPT = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 6 3.5 10l4 4M12.5 6l4 4-4 4"/></svg>';

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else if (k === "value" || k === "checked" || k === "disabled") el[k] = v;
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}

async function api(path, body) {
  const opts = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json", "X-KD-Token": TOKEN }, body: JSON.stringify(body),
  };
  const res = await fetch(path, opts);
  let data = {};
  try { data = await res.json(); } catch (err) { /* empty body */ }
  if (!res.ok) throw new Error(data.error || ("Something went wrong (" + res.status + ")."));
  return data;
}

async function loadCatalog() {
  try {
    const d = await api("/api/catalog");
    cat.clear(); catOrder = [];
    for (const r of d.rows) { cat.set(r.order, r); catOrder.push(r.order); }
    renderRows();
    if (selected) renderDetail();
  } catch (err) { /* dashboard opened without a server: keep the run-only view */ }
}

function listOrder() {
  const extra = order.filter((o) => !cat.has(o));   // rows that ran but are no longer in the catalog
  return catOrder.concat(extra);
}

function statusOf(o) {
  const r = rows.get(o);
  if (r) return r.status;
  return cat.get(o)?.manual ? "manual" : "pending";
}

function gapEl(after) {
  return h("div", { class: "gap" },
    h("button", { class: "add", type: "button", title: "Add a test here", "aria-label": "Add a test after this one",
                  onclick: () => openDrawer({ mode: "new", after }) }, "+"));
}

function iconBtn(o, tab, icon, label) {
  const on = drawer.open && drawer.order === o && drawer.tab === tab && drawer.mode === "edit";
  return h("button", { class: "ibtn", type: "button", title: label, "aria-label": label, "aria-pressed": String(on),
                       html: icon, onclick: () => openDrawer({ mode: "edit", order: o, tab }) });
}

function renderRows() {
  const host = $("rows");
  const keep = host.scrollTop;
  host.innerHTML = "";
  let lastArea = null;
  const list = listOrder();
  $("tests-count").textContent = list.length ? `Tests · ${list.length}` : "Tests";
  for (const o of list) {
    const c = cat.get(o) || {};
    const r = rows.get(o) || {};
    const status = statusOf(o);
    const area = c.area || r.area || "";
    if (area !== lastArea) { host.appendChild(h("div", { class: "group" }, area)); lastArea = area; }
    const title = c.title || r.title || area;
    const summary = c.summary || r.summary || "";
    const dur = r.duration != null ? r.duration.toFixed(1) + "s" : "";
    const state = c.script_state;
    const badges = [
      state === "draft" && h("span", { class: "badge draft" }, "no script yet"),
      state === "stale" && h("span", { class: "badge stale" }, "script out of date"),
      status === "manual" && h("span", { class: "badge manual" }, "by hand"),
    ];
    const card = h("div", {
      class: "card " + status + (drawer.open && drawer.order === o && drawer.mode === "edit" ? " editing" : ""),
      "aria-current": String(o === selected), "data-order": o,
    },
      h("button", { class: "card-main", type: "button", onclick: () => { pinned = true; select(o); } },
        h("span", { class: "mark" }, MARK[status] || "·"),
        h("span", { class: "body" },
          h("span", { class: "ttl" }, (c.money || r.money ? "💰 " : "") + title, badges),
          h("span", { class: "sum" }, summary)),
        h("span", { class: "dur" }, dur)),
      h("div", { class: "acts" },
        iconBtn(o, "catalog", ICON_CATALOG, "Catalog entry: read and edit what this test should do"),
        c.manual ? null : iconBtn(o, "script", ICON_SCRIPT, "Script: see the code")));
    host.appendChild(card);
    host.appendChild(gapEl(o));
    if (o === selected) requestAnimationFrame(() => card.scrollIntoView({ block: "nearest" }));
  }
  host.scrollTop = keep;
}

function select(o) {
  selected = o;
  renderRows();
  renderDetail();
}

function renderDetail() {
  const r = rows.get(selected);
  const c = cat.get(selected);
  const log = $("log");
  if (!r && !c) { log.innerHTML = '<p class="empty">Waiting for the run to start…</p>'; return; }
  const info = Object.assign({}, r || {}, c || {});

  $("d-area").textContent = info.title || info.area;
  $("d-meta").textContent = `${info.area} · test ${selected}` + (info.viewport ? ` · ${info.viewport}` : "");
  $("d-script").textContent = info.script ? `scripts/${info.script}` : "none (done by hand)";
  if (!r) {
    log.innerHTML = "";
    log.appendChild(h("p", { class: "empty" }, c.manual
      ? "Manual test: nobody runs a script for this one."
      : "This test has not run in this session yet."));
    return;
  }

  if (!r.entries.length && r.status === "pending") {
    log.innerHTML = '<p class="empty">Not started yet.</p>';
    return;
  }

  const frag = document.createDocumentFragment();
  const lbl = document.createElement("p"); lbl.className = "steps-label"; lbl.textContent = "Step by step";
  frag.appendChild(lbl);
  let shots = null;  // group consecutive screenshots into one thumbnail strip

  for (const e of r.entries) {
    if (e.kind === "screenshot") {
      if (!shots) { shots = document.createElement("div"); shots.className = "shots"; frag.appendChild(shots); }
      const fig = document.createElement("div");
      fig.className = "shot";
      const img = document.createElement("img");
      img.src = "/shot/" + e.path.split("/").map(encodeURIComponent).join("/");
      img.alt = e.label;
      img.loading = "lazy";
      const cap = document.createElement("span");
      cap.textContent = e.label;
      fig.append(img, cap);
      fig.onclick = () => openLightbox(img.src, e.label);
      shots.appendChild(fig);
      continue;
    }
    shots = null;
    const line = document.createElement("div");
    line.className = "line " + (e.kind === "note" ? "note" : e.level === "error" ? "err" : "");
    const t = document.createElement("span"); t.className = "t"; t.textContent = clock(e.ts);
    const m = document.createElement("span"); m.className = "m"; m.textContent = e.text;
    line.append(t, m);
    frag.appendChild(line);
  }

  if (r.status === "fail" && r.error) {
    const pre = document.createElement("pre");
    pre.className = "trace";
    pre.textContent = r.error.trim();
    frag.appendChild(pre);
    if (r.traceDir) {
      const cmd = document.createElement("div");
      cmd.className = "tracecmd";
      cmd.textContent = `npx playwright show-trace reports/${window.__runId}/${r.traceDir}/trace_1.zip`;
      frag.appendChild(cmd);
    }
  }
  if (r.status === "skipped" && r.reason) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Skipped — " + r.reason;
    frag.appendChild(p);
  }

  const switched = lastShown !== selected;
  const stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 60;
  log.innerHTML = "";
  log.appendChild(frag);
  // Opening a test starts at the top (its description, first steps, first screenshots);
  // a test that is still running keeps following the newest line.
  if (switched) log.scrollTop = r.status === "running" ? log.scrollHeight : 0;
  else if (stick && r.status === "running") log.scrollTop = log.scrollHeight;
  lastShown = selected;
}

function openLightbox(src, alt) {
  const box = $("lightbox");
  const img = box.querySelector("img");
  img.src = src; img.alt = alt;
  box.classList.add("open");
}
$("lightbox").onclick = () => $("lightbox").classList.remove("open");

function recount() {
  let p = 0, f = 0, s = 0, run = 0, wait = 0;
  for (const r of rows.values()) {
    if (r.status === "pass") p++;
    else if (r.status === "fail") f++;
    else if (r.status === "skipped") s++;
    else if (r.status === "running") run++;
    else wait++;
  }
  const total = rows.size;
  if (!total) return;
  const idx = order.findIndex((o) => rows.get(o).status === "running");
  const now = $("bp-now");
  if (finished) now.textContent = f ? `Finished — ${f} of ${total} tests failed` : `Finished — all ${total} tests done`;
  else if (idx >= 0) now.textContent = `Test ${idx + 1} of ${total}`;
  else now.textContent = `${p + f + s} of ${total} tests done`;
  const bits = [
    `<span class="c-pass"><b>${p}</b> passed</span>`,
    `<span class="c-fail"><b>${f}</b> failed</span>`,
    `<span class="c-run"><b>${run}</b> running</span>`,
    `<span><b>${wait}</b> waiting</span>`,
  ];
  if (s) bits.push(`<span><b>${s}</b> skipped (real-money tests only run on purpose)</span>`);
  $("bp-counts").innerHTML = bits.join("");
  const w = (n) => (n / total * 100).toFixed(2) + "%";
  document.querySelector(".bp-bar .p").style.width = w(p);
  document.querySelector(".bp-bar .f").style.width = w(f);
  document.querySelector(".bp-bar .s").style.width = w(s);
  document.querySelector(".bp-bar .r").style.width = w(run);
}

function apply(e) {
  if (e.kind === "run_start") {
    window.__runId = e.run_id;
    order = []; rows.clear();
    for (const r of e.rows) ensureRow(r.order, {
      area: r.area, script: r.script, money: r.money,
      title: r.title, summary: r.summary, description: r.description, verifies: r.verifies, viewport: r.viewport,
    });
    $("target").textContent = `${e.run_id} → ${e.base_url}`;
    $("mode").textContent = e.headless ? "headless" : "headed";
    $("state").textContent = "running";
    renderRows(); recount();
    return;
  }
  if (e.kind === "run_end") {
    finished = true;
    recount();
    const badge = $("state");
    badge.textContent = e.failed ? `finished — ${e.failed} failed` : "finished";
    badge.className = "pill " + (e.failed ? "live" : "done");
    return;
  }
  if (!e.order) return;
  const r = ensureRow(e.order);

  if (e.kind === "row_start") {
    Object.assign(r, { status: "running", area: e.area || r.area, script: e.script || r.script });
    recount();
    if (!pinned) select(e.order); else renderRows();
    return;
  }
  if (e.kind === "row_end") {
    Object.assign(r, {
      status: e.status, duration: e.duration_s, error: e.error,
      traceDir: e.trace_dir, reason: e.reason,
    });
    recount(); renderRows();
    if (selected === e.order) renderDetail();
    return;
  }
  r.entries.push(e);
  if (selected === e.order) renderDetail();
}

async function poll() {
  try {
    const res = await fetch("/events?since=" + seq);
    const data = await res.json();
    if (data.events.length) {
      for (const e of data.events) apply(e);
      seq = data.seq;
    }
  } catch (err) { /* run process gone or busy — just try again */ }
  setTimeout(poll, finished ? 2000 : 500);
}
/* ================= editor drawer: catalog entry + script ================= */
const drawer = { open: false, mode: "edit", order: null, after: null, tab: "catalog", draft: {}, dirty: false, timer: null, msg: null };
const pendingJob = {};        // order -> rebuild job id waiting for approval (survives closing the drawer)
const EDIT_KEYS = ["title", "area", "summary", "description", "verifies", "credentials", "email", "viewport", "money", "manual", "sensitive"];

function fieldsOf(row) {
  const out = {};
  for (const k of EDIT_KEYS) out[k] = row ? row[k] : (k === "money" || k === "manual" || k === "sensitive" ? false : "");
  return out;
}

function openDrawer(opts) {
  if (drawer.open && drawer.dirty && !confirm("You have changes that are not saved. Discard them?")) return;
  if (drawer.open && opts.mode === "edit" && drawer.mode === "edit" && drawer.order === opts.order && drawer.tab === (opts.tab || "catalog")) {
    closeDrawer(true); return;      // clicking the same icon again closes it
  }
  clearTimeout(drawer.timer);
  const isNew = opts.mode === "new";
  const neighbour = cat.get(opts.after);
  Object.assign(drawer, {
    open: true, mode: opts.mode, order: opts.order || null, after: opts.after ?? null,
    tab: isNew ? "catalog" : (opts.tab || "catalog"), dirty: false, msg: null,
    draft: isNew ? Object.assign(fieldsOf(null), { area: neighbour?.area || "", viewport: "desktop" }) : fieldsOf(cat.get(opts.order)),
  });
  renderDrawer(); renderRows();
}

function closeDrawer(force) {
  if (!force && drawer.dirty && !confirm("You have changes that are not saved. Discard them?")) return;
  clearTimeout(drawer.timer);
  drawer.open = false; drawer.dirty = false;
  renderDrawer(); renderRows();
}

function setMsg(text, kind) {
  drawer.msg = text ? { text, kind } : null;
  renderMsg();
}
function renderMsg() {
  const box = $("dr-msg");
  box.innerHTML = "";
  if (drawer.msg) box.appendChild(h("div", { class: "msg " + (drawer.msg.kind || "") }, drawer.msg.text));
}

function renderDrawer() {
  const el = $("drawer");
  el.classList.toggle("open", drawer.open);
  el.setAttribute("aria-hidden", String(!drawer.open));
  if (!drawer.open) return;
  const c = drawer.mode === "edit" ? cat.get(drawer.order) : null;
  $("dr-title").textContent = drawer.mode === "new" ? "New test" : (c?.title || drawer.order);
  $("dr-sub").textContent = drawer.mode === "new"
    ? (drawer.after ? `will be added after test ${drawer.after}` : "will be added at the top")
    : `test ${drawer.order} · ${c?.script ? "scripts/" + c.script : "done by hand"}`;
  for (const b of $("dr-tabs").querySelectorAll("button")) {
    const t = b.dataset.tab;
    b.setAttribute("aria-selected", String(t === drawer.tab));
    b.hidden = t === "script" && (drawer.mode === "new" || c?.manual);
    b.onclick = () => switchTab(t);
  }
  renderMsg();
  renderBody();
}

function switchTab(t) {
  if (t === drawer.tab) return;
  clearTimeout(drawer.timer);
  drawer.tab = t; drawer.msg = null;
  renderDrawer(); renderRows();
}

function renderBody() {
  const body = $("dr-body");
  body.scrollTop = 0;
  if (drawer.tab === "catalog") { body.innerHTML = ""; body.appendChild(catalogForm()); }
  else renderScriptTab();
}

/* ---- catalog tab ---- */
function catalogForm() {
  const d = drawer.draft;
  const isNew = drawer.mode === "new";
  const c = cat.get(drawer.order);
  let saveBtn, rebuildBtn;
  const touch = () => { drawer.dirty = true; if (saveBtn) saveBtn.disabled = false; if (rebuildBtn) rebuildBtn.disabled = false; };
  const text = (k) => h("input", { type: "text", value: d[k] || "", oninput: (e) => { d[k] = e.target.value; touch(); } });
  const area = (k, rows) => h("textarea", { rows, value: d[k] || "", oninput: (e) => { d[k] = e.target.value; touch(); } });
  const check = (k, label) => h("label", {}, h("input", { type: "checkbox", checked: !!d[k], onchange: (e) => { d[k] = e.target.checked; touch(); } }), label);
  const viewport = h("select", { onchange: (e) => { d.viewport = e.target.value; touch(); } },
    ["desktop+mobile", "desktop", "mobile", "n/a"].map((v) => h("option", { value: v }, v)));

    isNew ? "Save & build script" : "Save & rebuild script");
  const note = !isNew && c?.script_state === "stale" ? "The script does not match these words yet."
    : !isNew && c?.script_state === "draft" ? "No script yet." : "";

  return h("div", { class: "form" },
    h("label", {}, "Title", text("title")),
    h("label", {}, "Area", text("area")),
    h("label", {}, "Summary", h("span", { class: "hint" }, "One line, shown on the test card."), text("summary")),
    h("label", {}, isNew ? "What should this test do?" : "What the test does, in your own words",
      h("span", { class: "hint" }, "Plain English. The script is built from this text."), area("description", 9)),
    h("label", {}, "What it must check", h("span", { class: "hint" }, "The results that make it pass."), area("verifies", 5)),
    h("details", {},
      h("summary", {}, "More: login, email, screen size, flags"),
      h("div", { class: "row2" },
        h("label", {}, "Login used", text("credentials")),
        h("label", {}, "Email used", text("email")),
        h("label", {}, "Screen size", viewport)),
      h("div", { class: "checks" },
        check("money", "💰 Moves real money"),
        check("sensitive", "Types secrets (never keep a trace)"),
        check("manual", "Done by hand (no script)"))),
    h("div", { class: "actions" }, saveBtn, rebuildBtn,
      h("button", { class: "btn", type: "button", onclick: () => closeDrawer() }, "Close"),
      h("span", { class: "status" }, note)));
}

async function saveCatalog(thenRebuild) {
  const wasNew = drawer.mode === "new";
  try {
    const path = wasNew ? "/api/catalog/insert" : "/api/catalog/save";
    const payload = wasNew ? { after: drawer.after, fields: drawer.draft } : { order: drawer.order, fields: drawer.draft };
    const { row } = await api(path, payload);
    await loadCatalog();
    Object.assign(drawer, { mode: "edit", order: row.order, draft: fieldsOf(cat.get(row.order)), dirty: false });
    if (thenRebuild && !row.manual) {
      drawer.tab = "script"; drawer.msg = null;
      renderDrawer(); renderRows();
      await startRebuild();
      return;
    }
    drawer.msg = { kind: "ok", text: wasNew
      ? "Added to the catalog as a draft. There is no script for it yet: open the Script tab to build one."
      : "Saved to the catalog." + (row.script_state === "stale" ? " The script is now out of date: rebuild it to match your words." : "") };
    renderDrawer(); renderRows();
  } catch (err) { setMsg(err.message, "err"); }
}

/* ---- script tab ---- */
async function renderScriptTab() {
  const body = $("dr-body");
  const order = drawer.order;
  body.innerHTML = "";
  if (pendingJob[order]) { await showJob(pendingJob[order]); return; }
  body.appendChild(h("p", { class: "placeholder" }, "Loading the script…"));
  try {
    const info = await api("/api/script?order=" + encodeURIComponent(order));
    if (!drawer.open || drawer.order !== order || drawer.tab !== "script" || pendingJob[order]) return;
    body.innerHTML = "";
    body.appendChild(scriptView(info));
  } catch (err) { setMsg(err.message, "err"); }
}

function codeBox(lines) {
  return h("div", { class: "code" }, lines.map(([n, txt, cls]) =>
    h("div", { class: "ln " + (cls || "") }, h("span", { class: "n" }, n), h("span", { class: "t" }, txt || " "))));
}

function scriptView(info) {
  const c = cat.get(drawer.order);
  const state = c?.script_state;
  const lines = info.exists ? info.code.replace(/\n$/, "").split("\n").map((t, i) => [i + 1, t]) : [];
  const when = info.modified ? "saved " + new Date(info.modified * 1000).toLocaleString() : "";
  return h("div", {},
    h("div", { class: "codebar" },
      h("code", {}, info.script ? "scripts/" + info.script : ""),
      state === "stale" && h("span", { class: "badge stale" }, "out of date"),
      state === "draft" && h("span", { class: "badge draft" }, "no script yet"),
      state === "ok" && h("span", { class: "badge" }, "matches the catalog"),
      when && h("span", { class: "hint", style: "color:var(--dim);font-size:12px" }, when),
      h("span", { class: "spacer" }),
      info.exists && h("button", { class: "btn", type: "button", onclick: async (e) => {
        try { await navigator.clipboard.writeText(info.code); e.target.textContent = "Copied"; } catch (err) { e.target.textContent = "Copy failed"; }
      } }, "Copy code"),
      h("button", { class: "btn primary", type: "button", onclick: startRebuild },
        info.exists ? "Rebuild from catalog" : "Build script")),
    info.exists ? codeBox(lines) : h("p", { class: "placeholder" }, "There is no script for this test yet. “Build script” asks Claude to write one from the catalog entry; you approve it before it is saved."));
}

async function startRebuild() {
  const order = drawer.order;
  try {
    const { job } = await api("/api/script/rebuild", { order });
    pendingJob[order] = job;
    setMsg(null);
    if (drawer.tab !== "script") { drawer.tab = "script"; renderDrawer(); } else renderScriptTab();
  } catch (err) { setMsg(err.message, "err"); }
}

async function showJob(id) {
  const order = drawer.order;
  const body = $("dr-body");
  clearTimeout(drawer.timer);
  let job;
  try { job = await api("/api/job?id=" + id); }
  catch (err) { delete pendingJob[order]; return renderScriptTab(); }
  if (!drawer.open || drawer.order !== order || drawer.tab !== "script") return;
  body.innerHTML = "";
  if (job.state === "running") {
    body.appendChild(h("div", { class: "working" }, h("b", {}, "Claude is rewriting the script… "),
      "This usually takes one to three minutes. You can close this panel: the result waits for you here."));
    drawer.timer = setTimeout(() => showJob(id), 1200);
    return;
  }
  if (job.state === "approved" || job.state === "rejected") { delete pendingJob[order]; return renderScriptTab(); }
  if (job.state === "error") {
    body.appendChild(h("div", { class: "msg err" }, job.error || "The rebuild failed."));
    body.appendChild(h("div", { class: "actions", style: "margin-top:14px" },
      h("button", { class: "btn primary", type: "button", onclick: () => { delete pendingJob[order]; startRebuild(); } }, "Try again"),
      h("button", { class: "btn", type: "button", onclick: async (e) => {
        try { await navigator.clipboard.writeText(job.prompt || ""); e.target.textContent = "Prompt copied: paste it into Claude Code"; } catch (err) { e.target.textContent = "Copy failed"; }
      } }, "Copy the prompt"),
      h("button", { class: "btn", type: "button", onclick: () => { api("/api/script/reject", { job: id }).catch(() => {}); delete pendingJob[order]; renderScriptTab(); } }, "Back to the script")));
    return;
  }
  // done: show the diff
  const lines = [];
  for (const raw of (job.diff || "").split("\n")) {
    if (raw.startsWith("---") || raw.startsWith("+++")) continue;
    if (raw.startsWith("@@")) lines.push(["", raw, "hunk"]);
    else if (raw.startsWith("+")) lines.push(["+", raw.slice(1), "add"]);
    else if (raw.startsWith("-")) lines.push(["−", raw.slice(1), "del"]);
    else lines.push(["", raw.slice(1)]);
  }
  const changed = lines.some(([, , cls]) => cls === "add" || cls === "del");
  body.appendChild(h("div", { class: "codebar" },
    h("b", {}, changed ? "Proposed change to the script" : "The script already does what your words say"),
    h("span", { class: "spacer" }),
    h("button", { class: "btn good", type: "button", onclick: () => decideJob(id, true) }, changed ? "Approve and replace the script" : "Mark the script as up to date"),
    changed && h("button", { class: "btn", type: "button", onclick: () => decideJob(id, false) }, "Reject: keep the current script")));
  if (changed) {
    body.appendChild(codeBox(lines));
    body.appendChild(h("p", { class: "hint", style: "color:var(--dim);font-size:12.5px" }, "Nothing has been saved yet. The old script is backed up in .history/ when you approve."));
  }
}

async function decideJob(id, approve) {
  const order = drawer.order;
  try {
    if (approve) await api("/api/script/approve", { job: id });
    else await api("/api/script/reject", { job: id });
    delete pendingJob[order];
    await loadCatalog();
    setMsg(approve ? "Done. The script is marked as matching the catalog." : null, approve ? "ok" : "");
    renderScriptTab();
  } catch (err) { setMsg(err.message, "err"); }
}

/* draggable divider between the test list and the right pane */
(function () {
  const div = $("divider"), root = document.documentElement;
  const clamp = (px) => Math.max(320, Math.min(window.innerWidth - 360, px));
  const setWidth = (px) => { root.style.setProperty("--left", clamp(px) + "px"); try { localStorage.setItem("kd-left", String(clamp(px))); } catch (err) { /* private mode */ } };
  try { const saved = Number(localStorage.getItem("kd-left")); if (saved) root.style.setProperty("--left", clamp(saved) + "px"); } catch (err) { /* private mode */ }
  let dragging = false;
  div.addEventListener("pointerdown", (e) => { dragging = true; div.setPointerCapture(e.pointerId); div.classList.add("drag"); });
  div.addEventListener("pointermove", (e) => { if (dragging) setWidth(e.clientX); });
  div.addEventListener("pointerup", () => { dragging = false; div.classList.remove("drag"); });
  div.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") setWidth($("tests").offsetWidth - 40);
    if (e.key === "ArrowRight") setWidth($("tests").offsetWidth + 40);
  });
})();

    msg.innerHTML = `Saved to <span title="${data.folder}">${data.folder.split("/").slice(-3).join("/")}</span> · `
      + `<a href="/export/index.html" target="_blank">open</a> · <a href="/export.zip">download zip</a>`;
  } catch (err) { msg.textContent = "Export failed: " + err.message; }
  btn.disabled = false;
});
</script>
</body>
</html>
