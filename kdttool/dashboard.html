  /* Light by default, dark follows the system. One blue for "clickable / selected";

  }
  :root[data-theme="dark"] {
    --bg: #0e1116; --surface: #151a21; --sunk: #1b212a; --ink: #e9ecf1; --mute: #9aa4b3; --faint: #6f7988; --line: #262d38;
    --accent: #7d9cff; --accent-ink: #0b1020; --accent-soft: #1a2440;
    --pass: #4cc38a; --pass-ink: #06170d; --pass-soft: #12261c;
    --fail: #ff7b72; --fail-soft: #2a1416;
    --warn: #e3b341; --warn-soft: #2a2210;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  ::selection { background: var(--accent-soft); color: var(--ink); }
  * { scrollbar-color: var(--line) transparent; scrollbar-width: thin; }
  input, textarea, select { accent-color: var(--accent); caret-color: var(--accent); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .c-pass { color: var(--pass); } .c-fail { color: var(--fail); } .c-skipped, .c-manual, .c-pending { color: var(--faint); } .c-running { color: var(--accent); }

  /* ---- buttons ---- */
  .btn {
    height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .btn:hover { border-color: var(--faint); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.good { background: var(--pass); border-color: var(--pass); color: var(--pass-ink); }
  .btn.good:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--fail); }
  .btn.danger:hover { border-color: var(--fail); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--mute); }
  .btn.ghost:hover { color: var(--ink); background: var(--sunk); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn:disabled:hover { border-color: var(--line); }
  .btn.primary:disabled:hover { border-color: var(--accent); }
  .mini {
    width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: 6px; cursor: pointer;
    background: transparent; border: 0; color: var(--mute);
  }
  .mini svg { width: 16px; height: 16px; }
  .mini:hover { background: var(--surface); color: var(--ink); }
  .mini[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

  /* ---- the one slim bar ---- */
  .bar {
    position: relative; flex: none; height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 20px;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
  .logo { height: 48px; width: auto; display: block; }
  #theme-btn { width: 32px; height: 32px; }
  #theme-btn svg { width: 18px; height: 18px; }
  .target { color: var(--mute); font-size: 13px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp { flex: 1; }
  .tally { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--mute); white-space: nowrap; }
  .tally span { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .tally i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .tally .p i { background: var(--pass); } .tally .f i { background: var(--fail); } .tally .r i { background: var(--accent); }
  .tally b { color: var(--ink); font-weight: 500; }
  .opt { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--mute); cursor: pointer; white-space: nowrap; }
  .opt input { margin: 0; }
  #start-btn { height: 36px; padding: 0 20px 0 16px; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
  #start-btn svg { width: 16px; height: 16px; }
  .ready { display: grid; gap: 6px; padding: 8px 0; }
  .ready h3 { margin: 0; font-size: 16px; font-weight: 600; }
  .ready p { margin: 0; color: var(--mute); }
  .ready p b { color: var(--ink); font-weight: 500; }
  #export-msg { font-size: 13px; color: var(--mute); max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #export-msg a { color: var(--accent); }
  #export-msg .ok { color: var(--pass); font-weight: 500; }
  #export-msg.bad { color: var(--fail); font-weight: 500; }
  .elapsed { font-size: 13px; color: var(--mute); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .elapsed b { color: var(--ink); font-weight: 500; margin-left: 4px; }
  .prog { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; }
  .prog i { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); transition: transform .35s var(--ease); }
  .prog .p { background: var(--pass); } .prog .f { background: var(--fail); }
  .prog .s { background: var(--faint); opacity: .55; } .prog .r { background: var(--accent); }

  main { flex: 1; display: flex; min-height: 0; }

  /* ---- left: the test list ---- */
  #tests { width: var(--left, 400px); min-width: 320px; flex: none; display: flex; flex-direction: column; background: var(--surface); min-height: 0; }
  #tests-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 4px 20px; font-size: 13px; color: var(--mute); }
  #rows { flex: 1; overflow-y: auto; padding-bottom: 40px; }
  #divider { width: 1px; flex: none; position: relative; cursor: col-resize; background: var(--line); transition: box-shadow .15s; }
  #divider::before { content: ""; position: absolute; inset: 0 -4px; }
  #divider:hover, #divider.drag, #divider:focus-visible { box-shadow: 0 0 0 1px var(--accent); background: var(--accent); outline: none; }
  #right { flex: 1; min-width: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); }

  .group { padding: 14px 20px 4px; font-size: 12px; font-weight: 500; color: var(--mute); }
  .card { position: relative; margin: 0 8px; border-radius: 8px; }
  .card:hover, .card[aria-current="true"], .card.editing { background: var(--sunk); }
  .card-main {
    width: 100%; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 2px 12px; align-items: start; text-align: left;
    padding: 9px 12px; background: none; border: 0; border-radius: 8px; color: var(--ink); cursor: pointer;
  }
  .card-main:focus-visible { outline-offset: -2px; }
  .card .mark, .card .dur { height: 20px; display: flex; align-items: center; }
  .card .mark svg { width: 16px; height: 16px; }
  .card.running .mark svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card .body { min-width: 0; display: block; }
  .card .ttl { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 500; line-height: 20px; }
  .card .ttl .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card.skipped .ttl, .card.manual .ttl, .card.pending .ttl { color: var(--mute); }
  .card .sum { display: none; margin-top: 1px; font-size: 13px; color: var(--mute); }
  .card[aria-current="true"] .sum { display: block; }
  .card .dur { min-width: 58px; justify-content: flex-end; font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .chip {
    flex: none; font-size: 12px; font-weight: 500; padding: 0 8px; line-height: 18px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--mute); background: var(--surface);
  }
  .chip.draft { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  .chip.stale { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  /* Edit and Script icons only show when you point at a row, select it, or tab into it */
  .acts { position: absolute; right: 10px; top: 5px; display: flex; gap: 2px; opacity: 0; pointer-events: none; }
  .card:hover .acts, .card:focus-within .acts, .card[aria-current="true"] .acts, .card.editing .acts { opacity: 1; pointer-events: auto; }

  /* the thin "+" line between two tests */
  .gap { position: relative; height: 0; z-index: 2; }
  .gap::before { content: ""; position: absolute; left: 16px; right: 16px; top: 0; border-top: 1px dashed var(--accent); opacity: 0; transition: opacity .12s; }
  .gap .add {
    position: absolute; left: 50%; top: -11px; transform: translateX(-50%); width: 22px; height: 22px; padding: 0;
    border-radius: 50%; border: 1px solid var(--accent); background: var(--surface); color: var(--accent);
    font-size: 16px; line-height: 1; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .12s;
  }
  .card:hover + .gap .add, .gap:hover .add, .gap .add:focus-visible { opacity: 1; pointer-events: auto; }
  .card:hover + .gap::before, .gap:hover::before { opacity: .7; }
  .gap .add:hover { background: var(--accent); color: var(--accent-ink); }
  @media (hover: none) { .gap .add { opacity: .55; pointer-events: auto; } }

  /* ---- right pane: what happened ---- */
  #detail { display: flex; flex-direction: column; min-width: 0; overflow: hidden; flex: 1; }
  #detail-head, .dr-head { display: flex; align-items: center; gap: 16px; padding: 16px 28px 14px; }
  #detail-head .who, .dr-head .who { flex: 1; min-width: 0; }
  #detail-head h2, .dr-head h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.015em; line-height: 1.3; }
  .sub { margin: 2px 0 0; font-size: 13px; color: var(--mute); }
  .sub code { font-family: var(--mono); font-size: 12px; }
  .pillx { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; padding: 4px 12px; border-radius: 999px; background: var(--sunk); color: var(--mute); }
  .pillx svg { width: 14px; height: 14px; }
  .pillx.pass { background: var(--pass-soft); color: var(--pass); }
  .pillx.fail { background: var(--fail-soft); color: var(--fail); }
  .pillx.running { background: var(--accent-soft); color: var(--accent); }
  #log { flex: 1; overflow-y: auto; padding: 4px 28px 40px; display: grid; gap: 22px; align-content: start; }
  .empty { margin: 0; color: var(--mute); padding: 12px 0; }
  .sech { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px; font-size: 13px; font-weight: 500; color: var(--mute); }

  .alert { background: var(--fail-soft); border-radius: 12px; padding: 16px 18px; display: grid; gap: 10px; }
  .alert .why { font-weight: 600; color: var(--fail); }
  .alert .reason { font-size: 16px; overflow-wrap: anywhere; }
  .alert .cmd { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 5px 5px 12px; }
  .alert .cmd code { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .errfull summary { cursor: pointer; font-size: 13px; color: var(--mute); width: fit-content; }
  .errfull summary:hover { color: var(--ink); }
  .errfull pre { margin: 8px 0 0; padding: 12px 14px; max-height: 260px; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }

  .shots { display: flex; flex-wrap: wrap; gap: 14px; }
  .shot { width: 300px; padding: 0; border: 0; background: none; text-align: left; cursor: zoom-in; }
  .shot .img { display: block; position: relative; aspect-ratio: 1100 / 620; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: #fff; }
  .shot .img img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .shot .no {
    position: absolute; left: 8px; top: 8px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    background: var(--ink); color: var(--surface); font-size: 12px; font-weight: 600;
  }
  .shot.bad .img { border-color: var(--fail); }
  .shot .cap { display: block; margin-top: 6px; font-size: 12px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shot:hover .img { border-color: var(--faint); } .shot.bad:hover .img { border-color: var(--fail); }

  .steps { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .steps li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 16px; border-top: 1px solid var(--line); }
  .steps li:first-child { border-top: 0; }
  .steps li.bad { background: var(--fail-soft); }
  .steps .mk { display: grid; place-items: center; }
  .steps .mk svg { width: 16px; height: 16px; }
  .steps .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  .steps .txt { min-width: 0; overflow-wrap: anywhere; }
  .steps .txt.note { font-weight: 500; }
  .steps .q { font-family: var(--mono); font-size: 13px; color: var(--mute); }
  .steps .vp { margin-left: 8px; font-size: 12px; color: var(--mute); }
  .steps .tm { font-family: var(--mono); font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .ref { margin-left: 8px; padding: 0; border: 0; background: none; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--accent); }
  .ref:hover { text-decoration: underline; text-underline-offset: 2px; }

  /* ---- the editor: slides open over the right pane ---- */
  #drawer {
    position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 20;
    transform: translateX(-102%); transition: transform .22s var(--ease); visibility: hidden;

  }

  .tabs { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--sunk); }
  .tabs button { height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--mute); cursor: pointer; font-size: 13px; font-weight: 500; }

  #dr-msg { padding: 0 28px; }

  #dr-msg .msg.ok { background: var(--pass-soft); color: var(--pass); }
  #dr-msg .msg.err { background: var(--fail-soft); color: var(--fail); }
  #dr-body { flex: 1; overflow-y: auto; padding: 6px 28px 32px; }
  #dr-foot { flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 28px; border-top: 1px solid var(--line); background: var(--surface); }
  #dr-foot:empty { display: none; }
  #dr-foot .st { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--mute); }
  #dr-foot .st i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  #dr-foot .st i.ok { background: var(--pass); } #dr-foot .st i.warn { background: var(--warn); }
  #dr-foot .st.ask { color: var(--ink); font-weight: 500; }

  .form { max-width: 700px; display: grid; gap: 18px; }
  .form label { display: grid; gap: 6px; font-size: 13px; font-weight: 500; }
  .form input[type=text], .form textarea, .form select {

  .form input:focus, .form textarea:focus, .form select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .form .hint { font-size: 12px; font-weight: 400; color: var(--mute); }
  .form details summary { cursor: pointer; color: var(--mute); font-size: 13px; font-weight: 500; padding: 4px 0; width: fit-content; }
  .form details summary:hover { color: var(--ink); }
  .form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
  .form .checks { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 14px; }
  .form .checks label { display: flex; align-items: center; gap: 8px; font-weight: 400; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .codebar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .codebar code { font-family: var(--mono); font-size: 12px; color: var(--mute); }
  .codebar .note { font-size: 12px; color: var(--mute); }
  .codebar .spacer { flex: 1; }
  .code { font-family: var(--mono); font-size: 12px; line-height: 1.6; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: auto; padding: 8px 0; }
  .code .ln { display: flex; }
  .code .n { flex: none; width: 48px; text-align: right; padding-right: 12px; color: var(--mute); user-select: none; }
  .code .t { white-space: pre; padding-right: 16px; }
  .code .add { background: var(--pass-soft); } .code .del { background: var(--fail-soft); } .code .hunk { color: var(--accent); background: var(--accent-soft); }
  .working { padding: 24px; border: 1px dashed var(--line); border-radius: 12px; color: var(--mute); }
  .working b { color: var(--ink); }
  .placeholder { margin: 0; color: var(--mute); padding: 16px 0; }
  .hint-line { margin: 12px 0 0; font-size: 12px; color: var(--mute); }

  /* ---- screenshot viewer ---- */
  #lightbox {
    position: fixed; inset: 0; background: rgba(6,8,12,.9); display: none;
    align-items: flex-start; justify-content: center; overflow: auto; z-index: 50; cursor: zoom-out;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: min(1100px, 96vw); margin: 56px 0 3vh; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  #lb-close { position: fixed; top: 14px; right: 18px; width: 36px; height: 36px; color: #fff; }
  #lb-close:hover { background: rgba(255,255,255,.14); color: #fff; }
  #lb-close svg { width: 18px; height: 18px; }
</style>

<script>
const rows = new Map();      // order -> {area, script, money, status, duration, error, traceDir, entries[]}
let order = [];              // display order
let selected = null;         // currently shown row
let pinned = false;          // true once the user clicks a row: stop auto-following
let seq = 0;
let finished = false;
let lastShown = null;       // which row the log pane last rendered

const $ = (id) => document.getElementById(id);
const icon = (name) => `<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;

function clock(ts) {
  const d = new Date(ts * 1000);
  return d.toTimeString().slice(0, 8);
}

function ensureRow(o, data) {
  if (!rows.has(o)) {
    rows.set(o, { area: "", script: "", money: false, status: "pending", entries: [] });
    order.push(o);
  }
  Object.assign(rows.get(o), data || {});
  return rows.get(o);
}

const TOKEN = "__KD_TOKEN__";
const cat = new Map();       // order -> catalog row (source of truth for the words)
let catOrder = [];

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else if (k === "value" || k === "checked" || k === "disabled") el[k] = v;
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}

async function api(path, body) {
  const opts = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json", "X-KD-Token": TOKEN }, body: JSON.stringify(body),
  };
  const res = await fetch(path, opts);
  let data = {};
  try { data = await res.json(); } catch (err) { /* empty body */ }
  if (!res.ok) throw new Error(data.error || ("Something went wrong (" + res.status + ")."));
  return data;
}

async function loadCatalog() {
  try {
    const d = await api("/api/catalog");
    cat.clear(); catOrder = [];
    for (const r of d.rows) { cat.set(r.order, r); catOrder.push(r.order); }
    renderRows();
    if (selected) renderDetail();
  } catch (err) { /* dashboard opened without a server: keep the run-only view */ }
}

function listOrder() {
  const extra = order.filter((o) => !cat.has(o));   // rows that ran but are no longer in the catalog
  return catOrder.concat(extra);
}

function statusOf(o) {
  const r = rows.get(o);
  if (r) return r.status;
  return cat.get(o)?.manual ? "manual" : "pending";
}

function gapEl(after) {
  return h("div", { class: "gap" },
    h("button", { class: "add", type: "button", title: "Add a test here", "aria-label": "Add a test after this one",
                  onclick: () => openDrawer({ mode: "new", after }) }, "+"));
}

function iconBtn(o, tab, name, label) {
  const on = drawer.open && drawer.order === o && drawer.tab === tab && drawer.mode === "edit";
  return h("button", { class: "mini", type: "button", title: label, "aria-label": label, "aria-pressed": String(on), "data-tab": tab,
                       html: icon(name), onclick: () => openDrawer({ mode: "edit", order: o, tab }) });
}

function renderRows() {
  const host = $("rows");
  const keep = host.scrollTop;
  const fa = document.activeElement;      // keep keyboard focus when the list redraws
  const focus = fa && host.contains(fa) && fa.closest("[data-order]")
    ? { order: fa.closest("[data-order]").dataset.order, tab: fa.dataset.tab || "" } : null;
  host.innerHTML = "";
  let lastArea = null;
  const list = listOrder();
  $("tests-count").textContent = list.length ? `${list.length} test${list.length === 1 ? "" : "s"}` : "Tests";
  for (const o of list) {
    const c = cat.get(o) || {};
    const r = rows.get(o) || {};
    const status = statusOf(o);
    const area = c.area || r.area || "";
    if (area !== lastArea) { host.appendChild(h("div", { class: "group" }, area)); lastArea = area; }
    const title = c.title || r.title || area;
    const summary = c.summary || r.summary || "";
    const dur = r.duration != null && status !== "skipped" ? r.duration.toFixed(1) + "s" : "";
    const state = c.script_state;
    const tags = [
      (c.money || r.money) && h("span", { class: "chip", title: "Moves real money, so it only runs on purpose" }, "Real money"),
      state === "draft" && h("span", { class: "chip draft" }, "No script yet"),
      state === "stale" && h("span", { class: "chip stale" }, "Script out of date"),
      status === "manual" && h("span", { class: "chip" }, "By hand"),
    ];
    const card = h("div", {
      class: "card " + status + (drawer.open && drawer.order === o && drawer.mode === "edit" ? " editing" : ""),
      "aria-current": String(o === selected), "data-order": o,
    },
      h("button", { class: "card-main", type: "button", onclick: () => { pinned = true; select(o); } },
        h("span", { class: "mark c-" + status, html: icon(status) }),
        h("span", { class: "body" },
          h("span", { class: "ttl" }, h("span", { class: "t" }, title), tags),
          h("span", { class: "sum" }, summary)),
        h("span", { class: "dur" }, dur)),
      h("div", { class: "acts" },
        iconBtn(o, "catalog", "edit", "Edit catalog entry: what this test should do"),
        c.manual ? null : iconBtn(o, "script", "code", "Script: see the code")));
    host.appendChild(card);
    host.appendChild(gapEl(o));
    if (o === selected) requestAnimationFrame(() => card.scrollIntoView({ block: "nearest" }));
  }
  host.scrollTop = keep;
  if (focus) {
    const sel = `[data-order="${CSS.escape(focus.order)}"] ` + (focus.tab ? `[data-tab="${focus.tab}"]` : ".card-main");
    host.querySelector(sel)?.focus({ preventScroll: true });
  }
}

function select(o) {
  selected = o;
  renderRows();
  renderDetail();
}

/* "[desktop] goto /cart" -> "Open /cart"; keeps the screen size only when a test runs on both */
function parseStep(raw) {
  let t = String(raw), vp = "";
  const m = t.match(/^\s*\[(desktop|mobile|tablet)\]\s*/i);
  if (m) { vp = m[1].toLowerCase(); t = t.slice(m[0].length); }
  t = t.replace(/^\s*[▲⚠]️?\s*/, "");
  const g = t.match(/^(goto|fill)\s+(.*)$/i);
  if (g) return { vp, parts: [g[1].toLowerCase() === "goto" ? "Open " : "Fill ", h("span", { class: "q" }, g[2])] };
  t = t.replace(/'([^']*)'/g, "“$1”");
  return { vp, parts: [t.charAt(0).toUpperCase() + t.slice(1)] };
}

/* the one line that says why it failed, out of a long traceback */
function failReason(error) {
  const lines = error.split("\n").map((s) => s.trim()).filter(Boolean);
  const isExc = (l) => /^[\w.]*(Error|Exception)\b[^:]*:/.test(l);
  const line = [...lines].reverse().find(isExc) || lines[lines.length - 1] || "";
  let text = line.replace(/^[\w.]*(Error|Exception)\b[^:]*:\s*/, "") || line;
  text = text.replace(/'([^']*)'/g, "“$1”");
  return text.charAt(0).toUpperCase() + text.slice(1);
}

function copyButton(text) {
  return h("button", { class: "btn", type: "button", onclick: async (e) => {
    const b = e.currentTarget;
    try { await navigator.clipboard.writeText(text); b.textContent = "Copied"; } catch (err) { b.textContent = "Copy failed"; }
    setTimeout(() => { b.textContent = "Copy"; }, 1600);
  } }, "Copy");
}

function setStatusPill(status, r) {
  const el = $("d-status");
  const dur = r && r.duration != null ? " · " + r.duration.toFixed(1) + "s" : "";
  const map = {
    pass: ["Passed" + dur, "pass", "pass"], fail: ["Failed" + dur, "fail", "fail"], running: ["Running", "running", "running"],
    skipped: ["Skipped", "", "skipped"], manual: ["By hand", "", "manual"], pending: ["Not run yet", "", "pending"],
  };
  const m = map[status] || map.pending;
  el.hidden = false;
  el.className = "pillx " + m[1];
  el.innerHTML = icon(m[2]);
  el.append(m[0]);
}

function renderDetail() {
  const r = rows.get(selected);
  const c = cat.get(selected);
  const log = $("log");
  if (!r && !c) { log.innerHTML = '<p class="empty">Waiting for the run to start…</p>'; $("d-status").hidden = true; return; }
  const info = Object.assign({}, r || {}, c || {});

  $("d-area").textContent = info.title || info.area;
  $("d-meta").replaceChildren(
    [info.area, info.viewport].filter(Boolean).join(" · ") + " · ",
    h("code", {}, info.script ? `scripts/${info.script}` : "done by hand"));
  setStatusPill(r ? r.status : (c && c.manual ? "manual" : "pending"), r);
  if (!r) {
    log.innerHTML = "";
    log.appendChild(h("p", { class: "empty" }, c.manual
      ? "Manual test: nobody runs a script for this one."
      : "This test has not run in this session yet."));
    return;
  }

  if (!r.entries.length && r.status === "pending") {
    log.innerHTML = '<p class="empty">Not started yet.</p>';
    return;
  }

  const frag = document.createDocumentFragment();

  // 1. if it failed: why, first
  if (r.status === "fail" && r.error) {
    const alert = h("div", { class: "alert" },
      h("div", { class: "why" }, "Why it failed"),
      h("div", { class: "reason" }, failReason(r.error)));
    if (r.traceDir) {
      const cmd = `npx playwright show-trace reports/${window.__runId}/${r.traceDir}/trace_1.zip`;
      alert.append(h("div", { class: "cmd" }, h("code", { title: cmd }, cmd), copyButton(cmd)));
    }
    alert.append(h("details", { class: "errfull" }, h("summary", {}, "Full error"), h("pre", {}, r.error.trim())));
    frag.appendChild(alert);
  }

  // 2. screenshots, numbered; each is linked to the step that took it
  const shots = [], steps = [];
  for (const e of r.entries) {
    if (e.kind === "screenshot") {
      shots.push(e);
      if (!steps.length) steps.push({ e: { kind: "note", text: e.label, ts: e.ts }, refs: [] });
      steps[steps.length - 1].refs.push(shots.length);
    } else steps.push({ e, refs: [] });
  }
  const shotSrc = (e) => "/shot/" + e.path.split("/").map(encodeURIComponent).join("/");
  if (shots.length) {
    const strip = h("div", { class: "shots" }, shots.map((e, i) => {
      const img = h("img", { src: shotSrc(e), alt: e.label, loading: "lazy" });
      return h("button", { class: "shot" + (/fail/i.test(e.label) ? " bad" : ""), type: "button", onclick: (ev) => openLightbox(shotSrc(e), e.label, ev.currentTarget) },
        h("span", { class: "img" }, img, h("span", { class: "no" }, String(i + 1))),
        h("span", { class: "cap" }, e.label));
    }));
    frag.appendChild(h("div", {}, h("div", { class: "sech" }, "Screenshots", h("span", {}, String(shots.length))), strip));
  }

  // 3. steps, in plain words
  if (steps.length) {
    const multi = /\+/.test(info.viewport || "");
    const list = h("ul", { class: "steps" }, steps.map(({ e, refs }) => {
      const bad = e.level === "error";
      const { vp, parts } = parseStep(e.text);
      return h("li", { class: bad ? "bad" : "" },
        bad ? h("span", { class: "mk c-fail", html: icon("fail") }) : h("span", { class: "mk" }, h("span", { class: "dot" })),
        h("span", { class: "txt" + (e.kind === "note" ? " note" : "") }, parts,
          multi && vp ? h("span", { class: "vp" }, vp) : null,
          refs.map((n) => h("button", { class: "ref", type: "button", onclick: (ev) => openLightbox(shotSrc(shots[n - 1]), shots[n - 1].label, ev.currentTarget) }, "Screenshot " + n))),
        h("span", { class: "tm" }, clock(e.ts)));
    }));
    frag.appendChild(h("div", {}, h("div", { class: "sech" }, "Steps"), list));
  }

  if (r.status === "skipped" && r.reason) frag.appendChild(h("p", { class: "empty" }, "Skipped — " + r.reason));

  const switched = lastShown !== selected;
  const stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 60;
  log.innerHTML = "";
  log.appendChild(frag);
  // Opening a test starts at the top (why it failed, first screenshots);
  // a test that is still running keeps following the newest line.
  if (switched) log.scrollTop = r.status === "running" ? log.scrollHeight : 0;
  else if (stick && r.status === "running") log.scrollTop = log.scrollHeight;
  lastShown = selected;
}

/* ---- elapsed time: from the run's first event to now, frozen when it ends ---- */
let runStartTs = null, runEndTs = null;
function fmtElapsed(sec) {
  sec = Math.max(0, Math.round(sec));
  const hh = Math.floor(sec / 3600), mm = Math.floor(sec % 3600 / 60), ss = sec % 60;
  const two = (n) => String(n).padStart(2, "0");
  return hh ? `${hh}:${two(mm)}:${two(ss)}` : `${mm}:${two(ss)}`;
}
function tickElapsed() {
  const box = $("elapsed");
  if (runStartTs == null) { box.hidden = true; return; }
  box.hidden = false;
  $("elapsed-lbl").textContent = runEndTs ? "Total time" : "Elapsed";
  $("elapsed-val").textContent = fmtElapsed((runEndTs || Date.now() / 1000) - runStartTs);
}
setInterval(tickElapsed, 1000);

function recount() {
  let p = 0, f = 0, s = 0, run = 0, wait = 0;
  for (const r of rows.values()) {
    if (r.status === "pass") p++;
    else if (r.status === "fail") f++;
    else if (r.status === "skipped") s++;
    else if (r.status === "running") run++;
    else wait++;
  }
  const total = rows.size;
  if (!total) return;
  const idx = order.findIndex((o) => rows.get(o).status === "running");
  const bits = [];
  if (!finished && idx >= 0) bits.push(h("span", {}, `Test ${idx + 1} of ${total}`));
  bits.push(h("span", { class: "p" }, h("i"), h("b", {}, String(p)), " passed"));
  bits.push(h("span", { class: "f" }, h("i"), h("b", {}, String(f)), " failed"));
  if (run) bits.push(h("span", { class: "r" }, h("i"), h("b", {}, String(run)), " running"));
  if (wait) bits.push(h("span", {}, h("i"), h("b", {}, String(wait)), " waiting"));
  if (s) bits.push(h("span", { title: "Real-money tests only run on purpose" }, h("i"), h("b", {}, String(s)), " skipped"));
  $("tally").replaceChildren(...bits);
  // segments sit side by side on one line; only transform animates
  let at = 0;
  for (const [cls, n] of [["p", p], ["f", f], ["s", s], ["r", run]]) {
    const frac = n / total;
    document.querySelector(".prog ." + cls).style.transform = `translateX(${(at * 100).toFixed(2)}%) scaleX(${frac.toFixed(4)})`;
    at += frac;
  }
}

function apply(e) {
  if (e.kind === "run_start") {
    window.__runId = e.run_id;
    order = []; rows.clear();
    for (const r of e.rows) ensureRow(r.order, {
      area: r.area, script: r.script, money: r.money,
      title: r.title, summary: r.summary, description: r.description, verifies: r.verifies, viewport: r.viewport,
    });
    setWaiting(false);
    runStartTs = e.ts; runEndTs = null; tickElapsed();
    $("target").textContent = `${e.run_id} · ${e.base_url}`;
    $("target").title = e.headless ? "Runs in the background (headless)" : "Runs in a visible browser window";
    renderRows(); recount();
    return;
  }
  if (e.kind === "run_end") {
    finished = true;
    runEndTs = e.ts; tickElapsed();
    recount();
    return;
  }
  if (!e.order) return;
  const r = ensureRow(e.order);

  if (e.kind === "row_start") {
    Object.assign(r, { status: "running", area: e.area || r.area, script: e.script || r.script });
    recount();
    if (!pinned) select(e.order); else renderRows();
    return;
  }
  if (e.kind === "row_end") {
    Object.assign(r, {
      status: e.status, duration: e.duration_s, error: e.error,
      traceDir: e.trace_dir, reason: e.reason,
    });
    recount(); renderRows();
    if (selected === e.order) renderDetail();
    return;
  }
  r.entries.push(e);
  if (selected === e.order) renderDetail();
}

let bootId = null;           // which start of the tool this page belongs to
async function poll() {
  try {
    const res = await fetch("/events?since=" + seq);
    const data = await res.json();
    if (data.boot) {
      // The tool was restarted while this tab stayed open: reload to reconnect (new secret token).
      if (bootId && bootId !== data.boot) { location.reload(); return; }
      bootId = data.boot;
    }
    if (data.events.length) {
      for (const e of data.events) apply(e);
      seq = data.seq;
    }
  } catch (err) { /* run process gone or busy — just try again */ }
  setTimeout(poll, finished ? 2000 : 500);
}
/* ================= editor drawer: catalog entry + script ================= */
const drawer = { open: false, mode: "edit", order: null, after: null, tab: "catalog", draft: {}, dirty: false, timer: null, msg: null, confirming: null };
const pendingJob = {};        // order -> rebuild job id waiting for approval (survives closing the drawer)
const EDIT_KEYS = ["title", "area", "summary", "description", "verifies", "credentials", "email", "viewport", "money", "manual", "sensitive"];

function fieldsOf(row) {
  const out = {};
  for (const k of EDIT_KEYS) out[k] = row ? row[k] : (k === "money" || k === "manual" || k === "sensitive" ? false : "");
  return out;
}

/* Unsaved changes: ask inside the panel (in the footer), not with a browser pop-up */
function guard(then) {
  if (drawer.open && drawer.dirty) { drawer.confirming = then; renderFoot(); return; }
  then();
}

function openDrawer(opts) { guard(() => doOpen(opts)); }

function doOpen(opts) {
  if (drawer.open && opts.mode === "edit" && drawer.mode === "edit" && drawer.order === opts.order && drawer.tab === (opts.tab || "catalog")) {
    doClose(); return;      // clicking the same icon again closes it
  }
  clearTimeout(drawer.timer);
  const isNew = opts.mode === "new";
  const neighbour = cat.get(opts.after);
  Object.assign(drawer, {
    open: true, mode: opts.mode, order: opts.order || null, after: opts.after ?? null,
    tab: isNew ? "catalog" : (opts.tab || "catalog"), dirty: false, msg: null, confirming: null,
    draft: isNew ? Object.assign(fieldsOf(null), { area: neighbour?.area || "", viewport: "desktop" }) : fieldsOf(cat.get(opts.order)),
  });
  renderDrawer(); renderRows();
}

function closeDrawer(force) { if (force) doClose(); else guard(doClose); }

function doClose() {
  clearTimeout(drawer.timer);
  drawer.open = false; drawer.dirty = false; drawer.confirming = null;
  renderDrawer(); renderRows();
}

function setMsg(text, kind) {
  drawer.msg = text ? { text, kind } : null;
  renderMsg();
}
function renderMsg() {
  const box = $("dr-msg");
  box.innerHTML = "";
  if (drawer.msg) box.appendChild(h("div", { class: "msg " + (drawer.msg.kind || "") }, drawer.msg.text));
}

function renderDrawer() {
  const el = $("drawer");
  el.classList.toggle("open", drawer.open);
  el.setAttribute("aria-hidden", String(!drawer.open));
  if (!drawer.open) return;
  const c = drawer.mode === "edit" ? cat.get(drawer.order) : null;
  $("dr-title").textContent = drawer.mode === "new" ? "New test" : "Edit test";
  $("dr-sub").textContent = drawer.mode === "new"
    ? (drawer.after ? `Will be added after test ${drawer.after}` : "Will be added at the top")
    : `${c?.title || drawer.order} · test ${drawer.order}`;
  for (const b of $("dr-tabs").querySelectorAll("button")) {
    const t = b.dataset.tab;
    b.setAttribute("aria-selected", String(t === drawer.tab));
    b.hidden = t === "script" && (drawer.mode === "new" || c?.manual);
    b.onclick = () => switchTab(t);
  }
  renderMsg();
  renderBody();
  renderFoot();
}

function switchTab(t) {
  if (t === drawer.tab) return;
  clearTimeout(drawer.timer);
  drawer.tab = t; drawer.msg = null;
  renderDrawer(); renderRows();
}

function renderBody() {
  const body = $("dr-body");
  body.scrollTop = 0;
  if (drawer.tab === "catalog") { body.innerHTML = ""; body.appendChild(catalogForm()); }
  else renderScriptTab();
}

/* fixed footer: the buttons never scroll out of sight */
function renderFoot() {
  const foot = $("dr-foot");
  foot.innerHTML = "";
  if (!drawer.open) return;
  if (drawer.confirming) {
    foot.append(
      h("span", { class: "st ask", role: "alert" }, "Discard your unsaved changes?"),
      h("button", { class: "btn ghost", type: "button", onclick: () => { drawer.confirming = null; renderFoot(); } }, "Keep editing"),
      h("button", { class: "btn danger", type: "button", onclick: () => { const go = drawer.confirming; drawer.dirty = false; drawer.confirming = null; go(); } }, "Discard changes"));
    return;
  }
  if (drawer.tab !== "catalog") return;
  const isNew = drawer.mode === "new";
  const c = cat.get(drawer.order);
  const state = isNew ? null : c?.script_state;
  const status = drawer.dirty ? ["", "Unsaved changes"]
    : state === "stale" ? ["warn", "The script does not match these words yet"]
    : state === "draft" ? ["warn", "No script yet"]
    : state === "ok" ? ["ok", "Script matches this description"] : null;
  const off = !isNew && !drawer.dirty;
  foot.append(
    h("span", { class: "st" }, status ? h("i", { class: status[0] }) : null, status ? status[1] : ""),
    h("button", { class: "btn ghost", type: "button", onclick: () => closeDrawer() }, drawer.dirty ? "Cancel" : "Close"),
    h("button", { class: "btn", type: "button", disabled: off, onclick: () => saveCatalog(false) }, isNew ? "Save as draft" : "Save"),
    h("button", { class: "btn primary", type: "button", disabled: off, onclick: () => saveCatalog(true) }, isNew ? "Save & build script" : "Save & rebuild script"));
}

/* ---- catalog tab: four fields up front, the rest under "More options" ---- */
function catalogForm() {

      area("description", 4), h("span", { class: "hint" }, "Plain English. The script is built from this text.")),

async function saveCatalog(thenRebuild) {
  const wasNew = drawer.mode === "new";
  try {
    const path = wasNew ? "/api/catalog/insert" : "/api/catalog/save";
    const payload = wasNew ? { after: drawer.after, fields: drawer.draft } : { order: drawer.order, fields: drawer.draft };
    const { row } = await api(path, payload);
    await loadCatalog();
    Object.assign(drawer, { mode: "edit", order: row.order, draft: fieldsOf(cat.get(row.order)), dirty: false });
    if (thenRebuild && !row.manual) {
      drawer.tab = "script"; drawer.msg = null;
      renderDrawer(); renderRows();
      await startRebuild();
      return;
    }
    drawer.msg = { kind: "ok", text: wasNew
      ? "Added to the catalog as a draft. There is no script for it yet: open the Script tab to build one."
      : "Saved to the catalog." + (row.script_state === "stale" ? " The script is now out of date: rebuild it to match your words." : "") };
    renderDrawer(); renderRows();
  } catch (err) { setMsg(err.message, "err"); }
}

/* ---- script tab ---- */
async function renderScriptTab() {
  const body = $("dr-body");
  const order = drawer.order;
  body.innerHTML = "";
  if (pendingJob[order]) { await showJob(pendingJob[order]); return; }
  body.appendChild(h("p", { class: "placeholder" }, "Loading the script…"));
  try {
    const info = await api("/api/script?order=" + encodeURIComponent(order));
    if (!drawer.open || drawer.order !== order || drawer.tab !== "script" || pendingJob[order]) return;
    body.innerHTML = "";
    body.appendChild(scriptView(info));
  } catch (err) { setMsg(err.message, "err"); }
}

function codeBox(lines) {
  return h("div", { class: "code" }, lines.map(([n, txt, cls]) =>
    h("div", { class: "ln " + (cls || "") }, h("span", { class: "n" }, n), h("span", { class: "t" }, txt || " "))));
}

function scriptView(info) {
  const c = cat.get(drawer.order);
  const state = c?.script_state;
  const lines = info.exists ? info.code.replace(/\n$/, "").split("\n").map((t, i) => [i + 1, t]) : [];
  const when = info.modified ? "saved " + new Date(info.modified * 1000).toLocaleString() : "";
  return h("div", {},
    h("div", { class: "codebar" },
      h("code", {}, info.script ? "scripts/" + info.script : ""),
      state === "stale" && h("span", { class: "chip stale" }, "Out of date"),
      state === "draft" && h("span", { class: "chip draft" }, "No script yet"),
      state === "ok" && h("span", { class: "chip" }, "Matches the catalog"),
      when && h("span", { class: "note" }, when),
      h("span", { class: "spacer" }),
      info.exists && h("button", { class: "btn", type: "button", onclick: async (e) => {
        try { await navigator.clipboard.writeText(info.code); e.target.textContent = "Copied"; } catch (err) { e.target.textContent = "Copy failed"; }
      } }, "Copy code"),

async function startRebuild() {
  const order = drawer.order;
  try {
    const { job } = await api("/api/script/rebuild", { order });
    pendingJob[order] = job;
    setMsg(null);
    if (drawer.tab !== "script") { drawer.tab = "script"; renderDrawer(); } else renderScriptTab();
  } catch (err) { setMsg(err.message, "err"); }
}

async function showJob(id) {
  const order = drawer.order;
  const body = $("dr-body");
  clearTimeout(drawer.timer);
  let job;
  try { job = await api("/api/job?id=" + id); }
  catch (err) { delete pendingJob[order]; return renderScriptTab(); }
  if (!drawer.open || drawer.order !== order || drawer.tab !== "script") return;

  if (job.state === "running") {
    body.appendChild(h("div", { class: "working" }, h("b", {}, "Claude is rewriting the script… "),
      "This usually takes one to three minutes. You can close this panel: the result waits for you here."));
    drawer.timer = setTimeout(() => showJob(id), 1200);

  }
  if (job.state === "approved" || job.state === "rejected") { delete pendingJob[order]; return renderScriptTab(); }
  if (job.state === "error") {
    body.appendChild(h("div", { class: "msg err", style: "padding:9px 14px;border-radius:8px;background:var(--fail-soft);color:var(--fail);font-size:13px" }, job.error || "The rebuild failed."));
    body.appendChild(h("div", { class: "actions" },
      h("button", { class: "btn primary", type: "button", onclick: () => { delete pendingJob[order]; startRebuild(); } }, "Try again"),
      h("button", { class: "btn", type: "button", onclick: async (e) => {
        try { await navigator.clipboard.writeText(job.prompt || ""); e.target.textContent = "Prompt copied: paste it into Claude Code"; } catch (err) { e.target.textContent = "Copy failed"; }
      } }, "Copy the prompt"),
      h("button", { class: "btn ghost", type: "button", onclick: () => { api("/api/script/reject", { job: id }).catch(() => {}); delete pendingJob[order]; renderScriptTab(); } }, "Back to the script")));
    return;
  }
  // done: show the diff
  const lines = [];
  for (const raw of (job.diff || "").split("\n")) {
    if (raw.startsWith("---") || raw.startsWith("+++")) continue;
    if (raw.startsWith("@@")) lines.push(["", raw, "hunk"]);
    else if (raw.startsWith("+")) lines.push(["+", raw.slice(1), "add"]);
    else if (raw.startsWith("-")) lines.push(["−", raw.slice(1), "del"]);
    else lines.push(["", raw.slice(1)]);
  }
  const changed = lines.some(([, , cls]) => cls === "add" || cls === "del");
  body.appendChild(h("div", { class: "codebar" },
    h("b", {}, changed ? "Proposed change to the script" : "The script already does what your words say"),
    h("span", { class: "spacer" }),
    h("button", { class: "btn good", type: "button", onclick: () => decideJob(id, true) }, changed ? "Approve and replace the script" : "Mark the script as up to date"),
    changed && h("button", { class: "btn", type: "button", onclick: () => decideJob(id, false) }, "Reject: keep the current script")));
  if (changed) {
    body.appendChild(codeBox(lines));
    body.appendChild(h("p", { class: "hint-line" }, "Nothing has been saved yet. The old script is backed up in .history/ when you approve."));
  }
}

async function decideJob(id, approve) {
  const order = drawer.order;
  try {
    if (approve) await api("/api/script/approve", { job: id });
    else await api("/api/script/reject", { job: id });
    delete pendingJob[order];
    await loadCatalog();
    setMsg(approve ? "Done. The script is marked as matching the catalog." : null, approve ? "ok" : "");
    renderScriptTab();
  } catch (err) { setMsg(err.message, "err"); }
}

/* ---- light / dark: follows the system until you pick one, then remembers it ---- */
const themeBtn = $("theme-btn");
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
function paintThemeBtn() {
  const dark = isDark(), label = dark ? "Switch to light theme" : "Switch to dark theme";
  themeBtn.innerHTML = icon(dark ? "sun" : "moon");
  themeBtn.title = label; themeBtn.setAttribute("aria-label", label);
}
themeBtn.onclick = () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("kd-theme", next); } catch (err) { /* private mode */ }
  paintThemeBtn();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintThemeBtn);
paintThemeBtn();

/* ---- wiring ---- */
$("dr-close").onclick = () => closeDrawer();
$("add-end").onclick = () => openDrawer({ mode: "new", after: catOrder.length ? catOrder[catOrder.length - 1] : null });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if ($("lightbox").classList.contains("open")) { closeLightbox(); return; }
  if (drawer.confirming) { drawer.confirming = null; renderFoot(); return; }
  if (drawer.open) closeDrawer();
});
window.addEventListener("beforeunload", (e) => { if (drawer.open && drawer.dirty) { e.preventDefault(); e.returnValue = ""; } });

/* draggable divider between the test list and the right pane */
(function () {
  const div = $("divider"), root = document.documentElement;
  const clamp = (px) => Math.max(320, Math.min(window.innerWidth - 360, px));
  const setWidth = (px) => { root.style.setProperty("--left", clamp(px) + "px"); try { localStorage.setItem("kd-left", String(clamp(px))); } catch (err) { /* private mode */ } };
  try { const saved = Number(localStorage.getItem("kd-left")); if (saved) root.style.setProperty("--left", clamp(saved) + "px"); } catch (err) { /* private mode */ }
  let dragging = false;
  div.addEventListener("pointerdown", (e) => { dragging = true; div.setPointerCapture(e.pointerId); div.classList.add("drag"); });
  div.addEventListener("pointermove", (e) => { if (dragging) setWidth(e.clientX); });
  div.addEventListener("pointerup", () => { dragging = false; div.classList.remove("drag"); });
  div.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") setWidth($("tests").offsetWidth - 40);
    if (e.key === "ArrowRight") setWidth($("tests").offsetWidth + 40);
  });
})();

async function loadState() {
  try { const st = await api("/api/state"); if (st.waiting) setWaiting(true, st); }
  catch (err) { /* no server: run-only view */ }
}
loadCatalog().then(loadState);

poll();

$("export-btn").addEventListener("click", async () => {
  const btn = $("export-btn"), msg = $("export-msg");
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "Exporting…";
  msg.className = ""; msg.textContent = "Building the report and copying the screenshots…";
  try {
    const data = await api("/export", {});       // api() sends the secret token the server requires
    msg.replaceChildren(
      h("span", { class: "ok", title: data.folder }, "Exported"), " · ",
      h("a", { href: "/export/index.html", target: "_blank" }, "Open"), " · ",
      h("a", { href: "/export.zip" }, "Download zip"));
  } catch (err) {
    msg.className = "bad";
    msg.textContent = "Export failed: " + err.message;
  }
  btn.disabled = false; btn.textContent = label;
});
</script>
